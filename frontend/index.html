<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Leak Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 48px;
            margin-bottom: 35px;
            font-weight: 800;
            letter-spacing: -2px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 18px 40px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: left 0.4s ease;
            z-index: -1;
        }
        
        .tab:hover::before {
            left: 0;
        }
        
        .tab:hover {
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }
        
        .content {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            display: none;
            animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(30px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }
        
        .content.active {
            display: block;
        }
        
        .content h2 {
            color: #2d3748;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }
        
        .content h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            padding: 60px 40px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .upload-area::before {
            content: '📁';
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .upload-area:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-color: #764ba2;
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        
        .upload-area p {
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
        }
        
        .upload-area input {
            display: none;
        }
        
        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 700;
            font-size: 15px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.1);
        }
        
        .result {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result.leak {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.4);
        }
        
        .result.no-leak {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            color: white;
            box-shadow: 0 15px 40px rgba(81, 207, 102, 0.4);
        }
        
        .result.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.4);
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .metric-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transition: all 0.6s ease;
        }
        
        .metric-card:hover::before {
            top: -80%;
            right: -80%;
        }
        
        .metric-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.5);
        }
        
        .metric-value {
            font-size: 42px;
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .metric-label {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .graphs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .graph-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8eeff 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .graph-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        
        .graph-card img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .graph-card:hover img {
            transform: scale(1.02);
        }
        
        .graph-card h3 {
            margin-bottom: 20px;
            color: #2d3748;
            font-size: 22px;
            font-weight: 700;
            position: relative;
            padding-bottom: 10px;
        }
        
        .graph-card h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #667eea;
            font-size: 20px;
            font-weight: 600;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .probability {
            display: flex;
            gap: 30px;
            margin-top: 25px;
            justify-content: center;
        }
        
        .prob-item {
            text-align: center;
            padding: 20px 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .prob-value {
            font-size: 32px;
            font-weight: 800;
            color: white;
            text-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .graphs {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧Water Leak Detection System</h1>
            <div class="tabs">
                <button class="tab active" onclick="showTab('train')">🚀 Train Model</button>
                <button class="tab" onclick="showTab('results')">📊 View Results</button>
                <button class="tab" onclick="showTab('predict')">🔮 Make Prediction</button>
            </div>
        </div>

        <div id="train" class="content active">
            <h2>Upload Dataset & Train Model</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>Drop your CSV file here or click to browse</p>
                <input type="file" id="fileInput" accept=".csv" onchange="uploadFile()">
            </div>
            <div id="trainStatus"></div>
        </div>

        <div id="results" class="content">
            <h2>Training Results & Visualizations</h2>
            <div id="resultsContent">
                <p class="loading">Train a model first to see results</p>
            </div>
        </div>

        <div id="predict" class="content">
            <h2>Make Prediction</h2>
            <div id="predictForm">
                <p class="loading">Train a model first to make predictions</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        let currentResults = null;

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            document.querySelectorAll('.tab').forEach(t => {
                if(t.textContent.toLowerCase().includes(tabName)) {
                    t.classList.add('active');
                }
            });
            
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'results' && currentResults) {
                displayResults();
            } else if (tabName === 'predict') {
                loadPredictForm();
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            const statusDiv = document.getElementById('trainStatus');
            statusDiv.innerHTML = '<p class="loading">Training model... This may take a few minutes</p>';
            
            try {
                const response = await fetch(`${API_URL}/train`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentResults = data;
                    statusDiv.innerHTML = `
                        <div class="result no-leak">
                            ✅ Model trained successfully!<br>
                            🎯 Accuracy: ${(data.accuracy * 100).toFixed(2)}%
                        </div>
                    `;
                    
                    setTimeout(() => {
                        showTab('results');
                    }, 1500);
                } else {
                    statusDiv.innerHTML = `<div class="result error">❌ Error: ${data.detail}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="result error">❌ Connection error. Check if backend is running.</div>`;
            }
        }

        function displayResults() {
            if (!currentResults) return;
            
            const resultsDiv = document.getElementById('resultsContent');
            
            resultsDiv.innerHTML = `
                <div class="metrics">
                    <div class="metric-card">
                        <div class="metric-label">Accuracy</div>
                        <div class="metric-value">${(currentResults.accuracy * 100).toFixed(2)}%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Samples</div>
                        <div class="metric-value">${currentResults.total_samples}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Training Samples</div>
                        <div class="metric-value">${currentResults.train_samples}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Testing Samples</div>
                        <div class="metric-value">${currentResults.test_samples}</div>
                    </div>
                </div>
                
                <div class="graphs">
                    <div class="graph-card">
                        <h3>📊 Feature Histograms</h3>
                        <img src="data:image/png;base64,${currentResults.images.histogram}" alt="Histogram">
                    </div>
                    <div class="graph-card">
                        <h3>🔥 Correlation Heatmap</h3>
                        <img src="data:image/png;base64,${currentResults.images.correlation}" alt="Correlation">
                    </div>
                    <div class="graph-card">
                        <h3>⭐ Feature Importance</h3>
                        <img src="data:image/png;base64,${currentResults.images.feature_importance}" alt="Feature Importance">
                    </div>
                    <div class="graph-card">
                        <h3>📈 Confusion Matrix</h3>
                        <img src="data:image/png;base64,${currentResults.images.confusion_matrix}" alt="Confusion Matrix">
                    </div>
                    <div class="graph-card">
                        <h3>📉 ROC Curve</h3>
                        <img src="data:image/png;base64,${currentResults.images.roc_curve}" alt="ROC Curve">
                    </div>
                    <div class="graph-card">
                        <h3>🎯 Precision-Recall Curve</h3>
                        <img src="data:image/png;base64,${currentResults.images.precision_recall}" alt="PR Curve">
                    </div>
                </div>
            `;
        }

        async function loadPredictForm() {
            try {
                const response = await fetch(`${API_URL}/features`);
                const data = await response.json();
                
                let formHTML = '<form id="predictionForm">';
                data.features.forEach(feature => {
                    formHTML += `
                        <div class="form-group">
                            <label for="${feature}">${formatLabel(feature)}</label>
                            <input type="number" step="any" id="${feature}" name="${feature}" required>
                        </div>
                    `;
                });
                formHTML += '<button type="submit">🔮 Predict Now</button></form><div id="predictionResult"></div>';
                
                document.getElementById('predictForm').innerHTML = formHTML;
                
                document.getElementById('predictionForm').addEventListener('submit', makePrediction);
            } catch (error) {
                document.getElementById('predictForm').innerHTML = '<p class="loading">Train a model first</p>';
            }
        }

        async function makePrediction(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const features = {};
            formData.forEach((value, key) => {
                features[key] = parseFloat(value);
            });
            
            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const resultClass = data.prediction === 1 ? 'leak' : 'no-leak';
                    const resultText = data.prediction === 1 ? '⚠️ LEAK DETECTED' : '✅ NO LEAK DETECTED';
                    
                    document.getElementById('predictionResult').innerHTML = `
                        <div class="result ${resultClass}">
                            ${resultText}
                            <div class="probability">
                                <div class="prob-item">
                                    <div>No Leak</div>
                                    <div class="prob-value">${(data.probability.no_leak * 100).toFixed(1)}%</div>
                                </div>
                                <div class="prob-item">
                                    <div>Leak</div>
                                    <div class="prob-value">${(data.probability.leak * 100).toFixed(1)}%</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('predictionResult').innerHTML = 
                        `<div class="result error">❌ Error: ${data.detail}</div>`;
                }
            } catch (error) {
                document.getElementById('predictionResult').innerHTML = 
                    '<div class="result error">❌ Connection error</div>';
            }
        }

        function formatLabel(feature) {
            return feature
                .replace(/_/g, ' ')
                .replace(/([A-Z])/g, ' $1')
                .trim()
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }
    </script>
</body>
</html>
